<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background -->
  <rect width="200" height="200" fill="#000000"/>

  <!-- Document/presentation shape -->
  <rect x="50" y="30" width="100" height="110" rx="8" fill="#ffffff" opacity="0.9"/>

  <!-- Slides inside document -->
  <line x1="60" y1="50" x2="140" y2="50" stroke="#000000" stroke-width="3"/>
  <line x1="60" y1="70" x2="140" y2="70" stroke="#000000" stroke-width="3"/>
  <line x1="60" y1="90" x2="140" y2="90" stroke="#000000" stroke-width="3"/>
  <line x1="60" y1="110" x2="110" y2="110" stroke="#000000" stroke-width="3"/>

  <!-- Loop arrows (perpetual) -->
  <path d="M 30 100 Q 10 85 30 70" stroke="#4ade80" stroke-width="4" fill="none" stroke-linecap="round"/>
  <polygon points="25,65 35,70 30,78" fill="#4ade80"/>

  <path d="M 170 100 Q 190 115 170 130" stroke="#4ade80" stroke-width="4" fill="none" stroke-linecap="round"/>
  <polygon points="175,135 165,130 170,122" fill="#4ade80"/>

  <!-- "LooPPT" text -->
  <text x="100" y="175" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">LooPPT</text>
</svg>
